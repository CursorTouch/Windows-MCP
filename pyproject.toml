[project]
name = "windows-mcp"
version = "0.8.9"
description = "Lightweight MCP Server for interacting with Windows Operating System."
authors = [
    { name = "Jeomon George", email = "jeogeoalukka@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE.md" }
keywords = ["windows", "mcp", "ai", "desktop", "ai agent"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: System :: Shells",
]
dependencies = [
    "click>=8.2.1",
    "comtypes>=1.4.15",
    "dxcam>=0.3.0",
    "fastmcp>=3.0",
    "fuzzywuzzy>=0.18.0",
    "markdownify>=1.1.0",
    "pillow>=11.2.1",
    "platformdirs>=4.3.8",
    "posthog>=7.4.0",
    "psutil>=7.0.0",
    "pygments>=2.20.0",
    "python-levenshtein>=0.27.1",
    "pywin32>=311",
    "requests>=2.33.0",
    "tabulate>=0.9.0",
    "thefuzz>=0.22.1",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/CursorTouch"
Repository = "https://github.com/CursorTouch/Windows-MCP"
Issues = "https://github.com/CursorTouch/Windows-MCP/issues"

[project.scripts]
windows-mcp = "windows_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/windows_mcp/uia/*.py" = ["F403", "F405"]
# The free-threaded interpreter check must run before the third-party imports.
"src/windows_mcp/__main__.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# Prefer a uv-managed CPython (installed or downloaded) for the venv. The
# Microsoft Store Python patch-updates itself and leaves the venv half-installed
# (win32com present, win32comext missing). "managed" rather than "only-managed"
# so an offline machine with only a system 3.14 can still start. Free-threaded
# builds are refused at startup by windows_mcp/interpreter.py, since neither the
# pin nor this setting keeps them out. Pair this with the bare minor version in
# .python-version ("3.14", never an exact patch such as "3.14.7"): an exact
# patch can't be resolved by a uv release older than that CPython patch, so
# the Claude Desktop extension fails to start. Bump .python-version only when
# requires-python moves; tests/test_python_pin.py enforces both rules.
python-preference = "managed"
constraint-dependencies = ["pydantic-settings>=2.14.2"]

[tool.uv.extra-build-dependencies]
pyperclip = ["setuptools"]
